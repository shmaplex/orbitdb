<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Vitest Browser Tests</title>
  <style>
    html,
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: monospace;
    }

    #output {
      white-space: pre-wrap;
      padding: 1rem;
    }
  </style>
</head>

<body>
  <h2>Vitest Browser Runner</h2>
  <div id="output"></div>
  <script type="module">
    import { run } from 'vitest/browser'
    import './bundle.js' // your built test bundle (Vite can build this)

    const output = document.getElementById('output')
    run().then((results) => {
      output.textContent = `✅ ${results.passed.length} passed, ❌ ${results.failed.length} failed`
    }).catch((err) => {
      output.textContent = `💥 Error: ${err.message}`
    })
  </script>
</body>

</html>
